name: GyroRed smoke tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile gyro_red.py relay.py
          node --check client/app.js
      - name: Install relay dependency
        run: python -m pip install "aiohttp>=3.9,<4"
      - name: Test paired WebSocket delivery and rejection
        run: python -m unittest discover -s tests -v
